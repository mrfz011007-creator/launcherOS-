name: Bootstrap LauncherOS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/launcher
          mkdir -p /tmp/launcher
          unzip -q LauncherOS-GitHub-Ready.zip -d /tmp/launcher
          root="$(find /tmp/launcher -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          cp -a "$root"/. .
          rm -rf /tmp/launcher LauncherOS-GitHub-Ready.zip
          rm -f .github/workflows/build-apk.yml
          rm -f .github/workflows/bootstrap.yml

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract LauncherOS project"
          git fetch origin main
          expected="$(git rev-parse origin/main)"
          git push --force-with-lease="refs/heads/main:$expected" origin HEAD:main
